name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # shipmill's Release workflow runs it on its release commit
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # actionlint-py publishes no Linux wheel, and its sdist build downloads the binary
      # from GitHub releases unpinned (#977): take the official release, checked by sha256
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 # linux_amd64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }} # empty outside workflow_call: the event's commit
          fetch-depth: 0 # evals check resolves each case's commit

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.7"
          python-version: "3.14"

      - run: uv sync --locked
      - run: uv run ruff check src tests skills hooks
      - run: uv run ruff format --check src tests skills hooks
      - run: uv run mypy
      - run: uv run pytest -q -n auto
      - name: Check the specs, and that a test proves each criterion of a built one
        run: |
          uv run --no-project python skills/github-issue-triage/scripts/specs.py check
          uv run --no-project python skills/github-issue-triage/scripts/specs.py coverage
      - name: Check the product direction and the review rubric (spec 024)
        run: |
          uv run shipmill product check
          uv run shipmill review check
      - name: Check the agents' eval suite without a model (spec 025)
        run: uv run shipmill evals check
      - name: Restore actionlint
        id: actionlint
        uses: actions/cache/restore@v6
        with:
          path: ~/.actionlint
          key: actionlint-${{ env.ACTIONLINT_VERSION }}-${{ env.ACTIONLINT_SHA256 }}
      - name: Download actionlint and check its sha256
        if: steps.actionlint.outputs.cache-hit != 'true'
        run: |
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "$url/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          mkdir -p ~/.actionlint
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C ~/.actionlint actionlint
      - name: Save actionlint
        if: steps.actionlint.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.actionlint
          key: ${{ steps.actionlint.outputs.cache-primary-key }}
      - run: echo "$HOME/.actionlint" >> "$GITHUB_PATH"
      - name: Lint the workflows, including the template init writes
        run: |
          actionlint -version
          actionlint .github/workflows/*.yml
          uv run python -c "
          import sys
          from pathlib import Path
          from shipmill.init import Detected, RunsOn, caller_text
          from shipmill.policy import Style, VersionFiles
          from shipmill.ticks import Tick, Ticks
          d = Detected('demo', 'main', Style.KEEP_A_CHANGELOG, VersionFiles.NONE)
          out = Path(sys.argv[1])
          windows = Ticks(hourly=False, windows=(Tick(0, 4, (1, 2, 3, 4, 5)), Tick(0, 16, (0,))))
          (out / 'release.yml').write_text(caller_text(d, 'ci.yml'))
          (out / 'release-label.yml').write_text(caller_text(d, 'ci.yml', RunsOn.parse('self-hosted')))
          (out / 'release-list.yml').write_text(caller_text(d, 'ci.yml', RunsOn.parse('[\"self-hosted\", \"linux\"]')))
          (out / 'release-windows.yml').write_text(caller_text(d, 'ci.yml', ticks=windows))
          (out / 'release-push.yml').write_text(caller_text(d, 'ci.yml', ticks=Ticks(hourly=False)))
          " "$RUNNER_TEMP"
          actionlint -ignore 'ci.yml' \
            "$RUNNER_TEMP/release.yml" "$RUNNER_TEMP/release-label.yml" "$RUNNER_TEMP/release-list.yml" \
            "$RUNNER_TEMP/release-windows.yml" "$RUNNER_TEMP/release-push.yml"
          uv run python -c "from shipmill.init import operate_caller_text; print(operate_caller_text())" \
            > "$RUNNER_TEMP/operate.yml"
          actionlint "$RUNNER_TEMP/operate.yml"
