name: Move the major tag

# Callers pin `@v0`, and the plugin's marketplace entry names a release tag: after a stable or
# hotfix release, point both at it. shipmill's land workflow starts this one with the release's
# tag; listed under a lane's after_publish (D-50), only once publish.yml's run passed and PyPI
# serves the version, so neither ever names a release PyPI can't serve. A ref the release
# commit already moved is left as it is. A release that isn't the newest stable one, such as a
# hotfix on an older series, moves neither.
#
# With land-environment set (spec 054, #1179), the job runs in that environment and reads its
# SHIPMILL_LAND_KEY secret, the private key of the App in [agents] app_id, as land.yml's land
# job does: the marketplace commit's push to the default branch goes as the App, which a
# ruleset can let past its rules. git gets the App's token from `shipmill app-token
# --git-credential`, so no step holds it. The major tag's force-push stays with the workflow
# token, as land's tags do (spec 054): a branch ruleset doesn't cover tags, and a tag pushed as
# the App would start every `on: push` tag workflow. land starts this workflow with the tag
# alone, so the input's default is what a release gets: keep it the land-environment of
# release.yml's land job. Empty, both pushes go with the workflow token, as before.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag, such as v0.2.0"
        type: string
        required: true
      land-environment:
        description: "The environment holding SHIPMILL_LAND_KEY, the App's key the marketplace commit is pushed with; empty: the workflow token"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  move:
    # empty, the job names no environment and reads no secret
    environment: ${{ inputs.land-environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Check the tag
        id: check
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a stable vX.Y.Z tag"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::no tag $TAG"
            exit 1
          fi
          newest=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          if [ "$newest" = "$TAG" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "newest=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is not the newest stable release ($newest is): the major tag and the marketplace stay"
          fi

      - uses: astral-sh/setup-uv@v10.2.0
        if: inputs.land-environment != ''
        with:
          version: "0.13.7"

      # The environment's secret, masked line by line before anything prints, in a file only
      # this job's user reads; its path and [agents] app_id are the step's outputs, never the
      # key. Both checks fail here, before either push
      - name: Write the App's key
        id: key
        if: inputs.land-environment != ''
        shell: bash
        env:
          KEY: ${{ secrets.SHIPMILL_LAND_KEY }}
          ENVIRONMENT: ${{ inputs.land-environment }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::move-major-tag: the environment $ENVIRONMENT has no SHIPMILL_LAND_KEY secret; add the App's private key to it as SHIPMILL_LAND_KEY, or dispatch with an empty land-environment. Nothing was pushed"
            exit 1
          fi
          while IFS= read -r line; do
            if [ -n "$line" ]; then echo "::add-mask::$line"; fi
          done <<<"$KEY"
          app_id=$(python3 -c 'import tomllib; print(tomllib.load(open(".github/shipmill.toml", "rb")).get("agents", {}).get("app_id", ""))')
          if ! [[ "$app_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::move-major-tag: .github/shipmill.toml sets no [agents] app_id, the App whose key SHIPMILL_LAND_KEY is; set it, or dispatch with an empty land-environment. Nothing was pushed"
            exit 1
          fi
          key="$RUNNER_TEMP/shipmill-land-key.pem"
          (umask 077; printf '%s\n' "$KEY" > "$key")
          chmod 600 "$key"
          echo "path=$key" >> "$GITHUB_OUTPUT"
          echo "app-id=$app_id" >> "$GITHUB_OUTPUT"

      - name: Point the major tag at the release
        if: steps.check.outputs.newest == 'true'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v([0-9]+)\. ]]
          major="v${BASH_REMATCH[1]}"
          git tag -f "$major" "$TAG^{commit}"
          git push -f origin "refs/tags/$major"

      # After the major tag's push, so that one stays with the workflow token (spec 054): git's
      # settings for the marketplace push, through its environment. The checkout's persisted
      # header, the workflow token's, is cleared (an empty value resets the list), and the App's
      # credential helper replaces any other. The helper mints the token, limited to this
      # repository, from the release's own shipmill, which PyPI serves (D-50); the settings name
      # the key's path and hold no token
      - name: Push as the App
        if: inputs.land-environment != ''
        shell: bash
        env:
          APP_KEY: ${{ steps.key.outputs.path }}
          APP_ID: ${{ steps.key.outputs.app-id }}
          TAG: ${{ inputs.tag }}
        run: |
          helper="!uvx --from shipmill==${TAG#v} shipmill app-token $GITHUB_REPOSITORY --app-id $APP_ID --app-key $APP_KEY --git-credential"
          {
            echo "GIT_CONFIG_COUNT=3"
            echo "GIT_CONFIG_KEY_0=http.https://github.com/.extraheader"
            echo "GIT_CONFIG_VALUE_0="
            echo "GIT_CONFIG_KEY_1=credential.https://github.com.helper"
            echo "GIT_CONFIG_VALUE_1="
            echo "GIT_CONFIG_KEY_2=credential.https://github.com.helper"
            echo "GIT_CONFIG_VALUE_2=$helper"
          } >> "$GITHUB_ENV"
          echo "the marketplace commit pushes as the App $APP_ID"

      - name: Point the marketplace at the release
        if: steps.check.outputs.newest == 'true'
        env:
          TAG: ${{ inputs.tag }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          file=.claude-plugin/marketplace.json
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "refs/heads/$BRANCH"
            git checkout -q --detach FETCH_HEAD
            python3 - "$file" "$TAG" <<'EOF'
          import re
          import sys

          path, tag = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as f:
              text = f.read()
          pattern = re.compile(r'"ref": "v[^"]+"')
          hits = len(pattern.findall(text))
          if hits != 1:
              sys.exit(f"::error::{path}: {pattern.pattern!r} matches {hits} times, want exactly 1")
          with open(path, "w", encoding="utf-8") as f:
              f.write(pattern.sub(lambda _: f'"ref": "{tag}"', text))
          EOF
            if git diff --quiet -- "$file"; then
              echo "$file names $TAG already"
              exit 0
            fi
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Point the marketplace at $TAG" -- "$file"
            if git push -q origin "HEAD:refs/heads/$BRANCH"; then
              echo "$file names $TAG on $BRANCH (attempt $attempt)"
              exit 0
            fi
          done
          echo "::error::$BRANCH kept moving: pointing $file at $TAG failed 5 times"
          exit 1
