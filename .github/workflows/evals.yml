# The agents' evals (spec 025, D-37): `claude plugin eval` runs the suite in evals/, offline,
# and `shipmill evals compare` gates a pull request's run against the default branch's.
# A scheduled or plain dispatched run on the default branch is the baseline; a pull request's
# run, or a dispatched run with `pr` and the head `sha` the maintainer read (which runs no case
# for any other head), is compared against it. Until the suite holds the first
# suite's counts (`shipmill evals check --gate`), the pull request job reports and exits 0.
name: evals

on:
  pull_request:
    paths:
      - "skills/**"
      - ".claude-plugin/**"
      - "evals/**"
      - "src/shipmill/gate.py" # the gate's session paragraphs are every session's instructions
  schedule:
    - cron: "0 6 * * 1" # weekly, on the default branch: a model update shows with no change here
  workflow_dispatch:
    inputs:
      pr:
        description: "A pull request's number to evaluate; a fork's pull request runs only this way"
        type: string
        default: ""
      sha:
        description: "With pr: the full head SHA you read; the run refuses any other head"
        type: string
        default: ""
      model:
        description: "Another model to run; its result never becomes the baseline"
        type: string
        default: ""

permissions:
  contents: read

env:
  EVALS_MODEL: claude-opus-5-5 # the gate sessions' model, the one place it is written (spec 025)
  # Workload Identity Federation (#442, S-025-26): none of these ids is a secret, since a token
  # is minted only for a GitHub OIDC token the rule matches. The rule follows the event: a
  # same-repo pull request's run uses the pull-request rule (#846), every run on the default
  # branch `shipmill-evals-main`. Each rule covers only the `shipmill-evals` workspace, so no
  # ANTHROPIC_WORKSPACE_ID
  ANTHROPIC_ORGANIZATION_ID: e3767508-33b1-4a4e-82bb-dedd54566ab5
  ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01QLwU4cCRmN9TW8ZW3NfggY # shipmill-evals
  ANTHROPIC_FEDERATION_RULE_ID: ${{ github.event_name == 'pull_request' && 'fdrl_01UA2FpuviYTtJHRe7EJskA2' || 'fdrl_01Pk7bGkjpHPcaWhVmDNMffp' }}

concurrency:
  group: evals-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read # the baseline: the default branch's runs and their artifacts
      pull-requests: read # a dispatched run's read of the pull request's current head
      id-token: write # GitHub's OIDC token, traded for the Anthropic one (S-025-25)
    steps:
      - name: Refuse a fork's pull request, which runs only by hand (D-16)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          line="evals: a fork's pull request runs only by hand: gh workflow run evals.yml -f pr=$PR -f sha=$HEAD_SHA"
          echo "$line" >>"$GITHUB_STEP_SUMMARY"
          echo "::error::$line"
          exit 1

      - name: Choose what this run is
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PR_EVENT: ${{ github.event.pull_request.number }}
          PR_INPUT: ${{ inputs.pr }}
          SHA_INPUT: ${{ inputs.sha }}
          MODEL_INPUT: ${{ inputs.model }}
          REF: ${{ github.ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          model=${MODEL_INPUT:-$EVALS_MODEL}
          ref=""
          sha=""
          case "$EVENT" in
            pull_request)
              mode="pr"
              pr=$PR_EVENT
              ;;
            schedule)
              mode=baseline
              pr=""
              ;;
            workflow_dispatch)
              if [ "$REF" != "refs/heads/$DEFAULT" ]; then
                echo "::error::evals: dispatch the run on the default branch, $DEFAULT; got $REF"
                exit 1
              fi
              pr=$PR_INPUT
              # the input's value is never echoed: it is a person's text, not a SHA yet
              if [ -z "$pr" ] && [ -n "$SHA_INPUT" ]; then
                echo "::error::evals: sha pins a pull request's run; dispatch it with -f pr=<N> beside it"
                exit 1
              fi
              if [ -n "$pr" ]; then
                if ! [[ "$pr" =~ ^[1-9][0-9]*$ ]]; then
                  echo "::error::evals: pr is a pull request's number"
                  exit 1
                fi
                if [ -z "$SHA_INPUT" ]; then
                  echo "::error::evals: a run with pr needs sha, the head SHA you read: -f pr=$pr -f sha=<head SHA>"
                  exit 1
                fi
                if ! [[ "$SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "::error::evals: sha is the 40 lowercase hexadecimal characters of the head SHA you read"
                  exit 1
                fi
                mode="pr"
                ref="refs/pull/$pr/merge"
                sha=$SHA_INPUT
              elif [ "$model" = "$EVALS_MODEL" ]; then
                mode=baseline
              else
                mode=model
              fi
              ;;
            *)
              echo "::error::evals: no run for the $EVENT event"
              exit 1
              ;;
          esac
          {
            echo "mode=$mode"
            echo "pr=$pr"
            echo "ref=$ref"
            echo "sha=$sha"
            echo "model=$model"
          } >>"$GITHUB_OUTPUT"

      # A dispatched run measures only the head the maintainer read (#545): the pull request's
      # head is read before any checkout or Anthropic token, and the merge ref's head parent
      # after the checkout, so a push after the read runs no case with an Anthropic token
      - name: Read the pull request's head before any checkout (S-025-20)
        if: steps.plan.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }} # this step's only; the checkout and the eval run have none
          REPO: ${{ github.repository }}
          PR: ${{ steps.plan.outputs.pr }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          current=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')
          if ! [[ "$current" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::evals: GitHub gave no full head SHA for #$PR"
            exit 1
          fi
          if [ "$current" != "$SHA" ]; then
            line="evals: the head of #$PR is $current, not $SHA; read the new commits and dispatch again with -f sha=$current"
            echo "$line" >>"$GITHUB_STEP_SUMMARY"
            echo "::error::$line"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.plan.outputs.ref }} # empty: the event's commit, a pull request's merge
          fetch-depth: 0 # each case's commit, and the merge base
          persist-credentials: false # no GitHub token in the checkout the cases clone

      - name: Check the merge ref's head is the one read (S-025-21)
        if: steps.plan.outputs.sha != ''
        env:
          PR: ${{ steps.plan.outputs.pr }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          # refs/pull/<N>/merge: its first parent is the default branch, its second the head
          if ! current=$(git rev-parse --verify --quiet 'HEAD^2^{commit}'); then
            line="evals: the checkout of refs/pull/$PR/merge has no head parent, so no case runs"
            echo "$line" >>"$GITHUB_STEP_SUMMARY"
            echo "::error::$line"
            exit 1
          fi
          if [ "$current" != "$SHA" ]; then
            line="evals: the head of #$PR is $current, not $SHA; read the new commits and dispatch again with -f sha=$current"
            echo "$line" >>"$GITHUB_STEP_SUMMARY"
            echo "::error::$line"
            exit 1
          fi
          echo "evals: measured $SHA of #$PR" >>"$GITHUB_STEP_SUMMARY" # the summary's first line (S-025-22)

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      # Every command that runs the checkout's code drops the OIDC request variables, which
      # would let it mint a GitHub OIDC token for any audience (S-025-26)
      - run: |
          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
          uv sync --locked

      - name: Check the suite, and whether the gate is on (S-025-16)
        id: gate
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
          uv run shipmill evals check
          if uv run shipmill evals check --gate >"$RUNNER_TEMP/gate.txt"; then
            echo "on=true" >>"$GITHUB_OUTPUT"
          else
            echo "on=false" >>"$GITHUB_OUTPUT"
          fi
          tail -n 1 "$RUNNER_TEMP/gate.txt" | tee -a "$GITHUB_STEP_SUMMARY"

      # After the S-025-20 and S-025-21 checks: exchange one GitHub OIDC token now, so a rule
      # that doesn't match shows before any case runs. No API key, not even as a fallback
      - name: Mint the Anthropic token (S-025-24, S-025-26)
        id: token
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          GATE_ON: ${{ steps.gate.outputs.on }}
        run: |
          # One line naming what failed, never a token (S-025-24)
          no_token() {
            line="evals: no Anthropic token from Workload Identity Federation ($1), so no case ran"
            echo "ok=false" >>"$GITHUB_OUTPUT"
            echo "$line" >>"$GITHUB_STEP_SUMMARY"
            if [ "$MODE" = pr ] && [ "$GATE_ON" != true ]; then
              echo "::warning::$line; the gate is off, so the pull request job exits 0"
              exit 0
            fi
            echo "::error::$line"
            exit 1
          }
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            no_token "GitHub gave the job no OIDC token request"
          fi
          jwt=$(curl -sS --fail -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r '.value // empty') || jwt=""
          [ -n "$jwt" ] || no_token "the GitHub OIDC token request failed"
          echo "::add-mask::$jwt"
          # The response holds the Anthropic token: only its status is kept
          status=$(printf '%s' "$jwt" | jq -Rc '{
              grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer", assertion: .,
              federation_rule_id: env.ANTHROPIC_FEDERATION_RULE_ID,
              organization_id: env.ANTHROPIC_ORGANIZATION_ID,
              service_account_id: env.ANTHROPIC_SERVICE_ACCOUNT_ID}' \
            | curl -sS -o /dev/null -w '%{http_code}' -X POST https://api.anthropic.com/v1/oauth/token \
                -H 'content-type: application/json' --data-binary @-) || status="no response"
          if [ "$status" != 200 ]; then
            no_token "the exchange with rule $ANTHROPIC_FEDERATION_RULE_ID got HTTP $status"
          fi
          dir="$RUNNER_TEMP/evals-identity" # never in the checkout the cases clone
          mkdir -p "$dir"
          chmod 700 "$dir"
          echo "dir=$dir" >>"$GITHUB_OUTPUT"
          echo "ok=true" >>"$GITHUB_OUTPUT"

      - name: Install Claude Code
        if: steps.token.outputs.ok == 'true'
        run: |
          npm install --global @anthropic-ai/claude-code
          claude --version

      - name: Find the default branch's baseline (S-025-12)
        id: base
        if: steps.token.outputs.ok == 'true' && steps.plan.outputs.mode == 'pr'
        env:
          GH_TOKEN: ${{ github.token }} # this step's only; the eval run has none
          REPO: ${{ github.repository }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          MODEL: ${{ steps.plan.outputs.model }}
        run: |
          dir="$RUNNER_TEMP/evals/base"
          runs=$(gh run list -R "$REPO" --workflow evals.yml --branch "$DEFAULT" --status success --limit 50 \
            --json databaseId,event --jq '.[] | select(.event == "schedule" or .event == "workflow_dispatch") | .databaseId')
          reason="no successful run on $DEFAULT left a baseline"
          for id in $runs; do
            created=$(gh api "repos/$REPO/actions/runs/$id/artifacts" \
              --jq '[.artifacts[] | select(.name == "evals-baseline" and (.expired | not))][0].created_at // ""')
            [ -n "$created" ] || continue
            gh run download "$id" -R "$REPO" -n evals-baseline -D "$dir"
            age=$(( $(date +%s) - $(date -d "$created" +%s) ))
            base_model=$(jq -r '.model' "$dir/meta.json")
            if [ "$age" -gt $(( 14 * 86400 )) ]; then
              reason="the baseline, run $id, is older than 14 days"
            elif [ "$base_model" != "$MODEL" ]; then
              reason="the baseline, run $id, ran $base_model, not $MODEL"
            else
              echo "fresh=true" >>"$GITHUB_OUTPUT"
              echo "base: the baseline of run $id ($created, $base_model)" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            rm -rf "$dir"
            break
          done
          echo "fresh=false" >>"$GITHUB_OUTPUT"
          echo "base: $reason, so the suite runs on the merge base first" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the suite
        id: run
        if: steps.token.outputs.ok == 'true'
        # while the gate is off, a pull request's run reports and never fails the job (S-025-16)
        continue-on-error: ${{ steps.plan.outputs.mode == 'pr' && steps.gate.outputs.on != 'true' }}
        env:
          TOKEN_DIR: ${{ steps.token.outputs.dir }}
          MODE: ${{ steps.plan.outputs.mode }}
          GATE_ON: ${{ steps.gate.outputs.on }}
          MODEL: ${{ steps.plan.outputs.model }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          ON_MERGE_BASE: ${{ steps.plan.outputs.mode == 'pr' && steps.base.outputs.fresh != 'true' }}
          PR: ${{ steps.plan.outputs.pr }}
          HEAD_SHA: ${{ steps.plan.outputs.sha }} # a dispatched run's: the head it measured (S-025-22)
        run: |
          # The tools the suite's cases allow, from their prompt.md frontmatter
          tools() {
            python3 - "$1" <<'PY'
          import re, sys
          from pathlib import Path
          found = set()
          for prompt in Path(sys.argv[1], "evals").rglob("prompt.md"):
              listed = re.search(r"^allowed_tools:\s*\[(.*)\]\s*$", prompt.read_text(encoding="utf-8"), re.M)
              if listed:
                  found.update(t.strip() for t in listed.group(1).split(",") if t.strip())
          print(",".join(sorted(found)))
          PY
          }
          # No token for the run: the S-025-24 line, and nothing to compare
          auth_failed() {
            line="evals: no Anthropic token from Workload Identity Federation ($1), so no case ran"
            echo "auth=failed" >>"$GITHUB_OUTPUT"
            echo "$line" >>"$GITHUB_STEP_SUMMARY"
            if [ "$MODE" = pr ] && [ "$GATE_ON" != true ]; then
              echo "::warning::$line; the gate is off, so the pull request job exits 0"
              exit 0
            fi
            echo "::error::$line"
            exit 1
          }
          # The identity token file holds a fresh GitHub OIDC token before each refresh of the
          # Anthropic one: each lasts about 5 minutes and is single-use, the Anthropic token
          # 10, and the client re-reads the file on each refresh (S-025-26). This shell writes
          # it; the eval run's environment can't request one
          token_file="$TOKEN_DIR/github-oidc.jwt"
          fetch_token() {
            curl -sS --fail -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -r '.value // empty' >"$token_file.new" && [ -s "$token_file.new" ] \
              && mv "$token_file.new" "$token_file"
          }
          fetch_token || auth_failed "the GitHub OIDC token request failed"
          (while sleep 120; do
            fetch_token || echo "::warning::evals: the OIDC token refresh failed; it retries in 2 minutes"
          done) &
          refresher=$!
          trap 'kill "$refresher" 2>/dev/null || true' EXIT
          # One run of the suite in a tree, its result in an output directory; no GitHub
          # token, no OIDC request variables, and no API key or auth token (they outrank
          # federation) in its environment, and the tree's offline gh stub first on PATH
          suite() {
            local tree=$1 out=$2 allowed code=0
            allowed=$(tools "$tree")
            [ -n "$allowed" ] || { echo "::error::evals: no case in $tree names its allowed_tools"; return 1; }
            mkdir -p "$out"
            (cd "$tree" && env -u GH_TOKEN -u GITHUB_TOKEN \
              -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
              -u ANTHROPIC_API_KEY -u ANTHROPIC_AUTH_TOKEN \
              ANTHROPIC_IDENTITY_TOKEN_FILE="$token_file" PATH="$tree/evals/bin:$PATH" \
              claude plugin eval . --trust-plugin --scaffold --allow-tools "$allowed" \
                --ablation none --no-publish --model "$MODEL" --runs 3 -j 4 --max-cost-usd 15 \
                --json "$out/aggregate-result.json") || code=$?
            # 2 is the budget, with partial results; compare names it, never compares them
            if [ ! -s "$out/aggregate-result.json" ]; then
              echo "::error::evals: claude plugin eval exited $code and wrote no result in $tree"
              return 1
            fi
            # pr and head: the pull request and the head SHA a dispatched run measured, else null
            jq -n --arg model "$MODEL" --arg commit "$(git -C "$tree" rev-parse HEAD)" \
              --arg claude "$(claude --version)" --argjson code "$code" --arg pr "$PR" --arg head "$HEAD_SHA" \
              '{model: $model, commit: $commit, claude: $claude, exit: $code,
                pr: (if $pr == "" then null else ($pr | tonumber) end),
                head: (if $head == "" then null else $head end)}' >"$out/meta.json"
            if [ "$(jq -r '.partialReason // ""' "$out/aggregate-result.json")" = auth_failed ]; then
              auth_failed "claude plugin eval stopped with partialReason auth_failed"
            fi
          }
          if [ "$ON_MERGE_BASE" = true ]; then
            merge_base=$(git merge-base "origin/$DEFAULT" HEAD)
            git worktree add --detach "$RUNNER_TEMP/evals/base-tree" "$merge_base"
            suite "$RUNNER_TEMP/evals/base-tree" "$RUNNER_TEMP/evals/base"
          fi
          suite "$GITHUB_WORKSPACE" "$RUNNER_TEMP/evals/head"

      - name: Upload the result and the report
        if: always() && steps.run.outcome != 'skipped'
        uses: actions/upload-artifact@v5
        with:
          name: evals-result
          path: |
            ${{ runner.temp }}/evals/head/
            ${{ runner.temp }}/evals/base/
            evals/results/
          if-no-files-found: warn

      - name: Keep the run as the baseline
        id: baseline
        if: steps.plan.outputs.mode == 'baseline' && steps.run.outcome == 'success'
        run: |
          partial=$(jq -r '.partial' "$RUNNER_TEMP/evals/head/aggregate-result.json")
          if [ "$partial" != false ]; then
            echo "::error::evals: the run stopped early (partial), so it is no baseline"
            exit 1
          fi

      - name: Upload the baseline
        if: steps.baseline.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: evals-baseline
          path: |
            ${{ runner.temp }}/evals/head/aggregate-result.json
            ${{ runner.temp }}/evals/head/meta.json
          if-no-files-found: error

      - name: Compare against the default branch (D-37)
        if: steps.plan.outputs.mode == 'pr' && steps.run.outcome != 'skipped' && steps.run.outputs.auth != 'failed'
        env:
          GATE_ON: ${{ steps.gate.outputs.on }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
          base="$RUNNER_TEMP/evals/base/aggregate-result.json"
          head="$RUNNER_TEMP/evals/head/aggregate-result.json"
          if [ ! -s "$base" ] || [ ! -s "$head" ]; then
            line="evals: no result to compare; the run failed before writing one"
            echo "$line" >>"$GITHUB_STEP_SUMMARY"
            if [ "$GATE_ON" = true ]; then
              echo "::error::$line"
              exit 1
            fi
            echo "::warning::$line; the gate is off, so the pull request job exits 0"
            exit 0
          fi
          # A case whose directory the pull request changed is judged on its own
          merge_base=$(git merge-base "origin/$DEFAULT" HEAD)
          changed=()
          for case_path in $(jq -r '.cases[].dir | sub("^evals/"; "")' "$head"); do
            git diff --quiet "$merge_base" HEAD -- "evals/$case_path" || changed+=(--changed "$case_path")
          done
          code=0
          uv run shipmill evals compare --base "$base" --head "$head" "${changed[@]}" \
            >"$RUNNER_TEMP/compare.txt" || code=$?
          # The moved cases, then both pass rates, as compare prints them
          {
            echo "### evals: compared against the default branch"
            echo
            echo '```'
            cat "$RUNNER_TEMP/compare.txt"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          if [ "$GATE_ON" = true ]; then
            exit "$code"
          fi
          echo "::warning::evals: compare exited $code, but the gate is off until the suite holds the first suite's counts, so the pull request job exits 0"

      - name: Report the spend
        if: always() && steps.run.outcome != 'skipped'
        env:
          ON_MERGE_BASE: ${{ steps.plan.outputs.mode == 'pr' && steps.base.outputs.fresh != 'true' }}
        run: |
          head="$RUNNER_TEMP/evals/head/aggregate-result.json"
          base="$RUNNER_TEMP/evals/base/aggregate-result.json"
          if [ ! -s "$head" ]; then
            echo "evals: the run wrote no result, so no spend to report" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo
            echo "### evals: spend"
            echo
            jq -r '"Spend: $\(.costUsd) over \(.durationSeconds)s"' "$head"
            if [ "$ON_MERGE_BASE" = true ] && [ -s "$base" ]; then
              jq -r '"Spend on the merge base: $\(.costUsd) over \(.durationSeconds)s"' "$base"
            fi
            echo
            echo "| Skill | Runs | Turns | Spend (USD) | Wall time (s) |"
            echo "|---|---|---|---|---|"
            jq -r '.cases | group_by(.dir | split("/")[1])[] | [.[].arms.with[]] as $runs
              | "| \(.[0].dir | split("/")[1]) | \($runs | length) | \([$runs[].turns // 0] | add)"
              + " | \([$runs[].costUsd // 0] | add) | \([$runs[].durationSeconds // 0] | add) |"' "$head"
          } | tee -a "$GITHUB_STEP_SUMMARY"
