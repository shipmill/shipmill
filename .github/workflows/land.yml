name: shipmill land

# Called after the caller's CI ran on the release commit. When CI passed it lands the
# release: main (a stable release on an unmoved main), release/X.Y (a hotfix), or the tag
# alone (a pre-release, or a stable release promoted while main moved on, which then gets a
# sync commit on main). It tags, publishes, and starts the lane's dispatch workflows; a lane
# with after_publish then waits, up to 30 minutes within the job's default 6-hour limit, for
# those runs to pass and PyPI to serve the version before it starts those workflows (D-50).
# Whatever happened, the work branch is deleted: a failed release is planned again. Under
# release = "propose", or for a stable lane that can hold a breaking change (spec 029), it
# then closes the lane's proposal issue, and it proposes the config upgrades the repo hasn't
# decided (spec 014).
#
# With land-environment set (spec 054), the land job runs in that environment of the caller's
# repository and reads its SHIPMILL_LAND_KEY secret, the private key of the App in [agents]
# app_id: the release commit's push to main, a hotfix's to release/X.Y, and the sync commit's
# go as the App, which a ruleset can let past its rules. The tag, the work branch, the GitHub
# release, and the dispatches stay with the workflow token. Empty, it lands as before.

on:
  workflow_call:
    inputs:
      ci-result:
        type: string
        required: true
      lane:
        type: string
        required: true
      version:
        type: string
        required: true
      sha:
        type: string
        required: true
      base:
        type: string
        required: true
      tool:
        type: string
        default: "git+https://github.com/shipmill/shipmill@v0"
      runs-on:
        description: "The runner for every job: a label, or a JSON list of labels"
        type: string
        default: "ubuntu-latest"
      land-environment:
        description: "The environment holding SHIPMILL_LAND_KEY, the App's key the protected branches are pushed with; empty: the workflow token"
        type: string
        default: ""

# No workflow-level permissions: each job sets its own, except close-proposal and upgrade,
# which take the caller's grant, so a caller that grants no `issues: write` still starts this
# workflow

jobs:
  land:
    if: inputs.ci-result == 'success'
    # empty, the job names no environment and reads no secret (S-054-1)
    environment: ${{ inputs.land-environment }}
    concurrency:
      group: shipmill
      cancel-in-progress: false
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    permissions:
      contents: write # main, release branches, tags, and releases
      actions: write # starts dispatch workflows; a push with this token starts none
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.7"

      # The environment's secret, masked line by line before anything prints, in a file only
      # this job's user reads; its path is the step's output, never the key (S-054-3)
      - name: Write the App's key
        id: key
        if: inputs.land-environment != ''
        shell: bash
        env:
          KEY: ${{ secrets.SHIPMILL_LAND_KEY }}
          ENVIRONMENT: ${{ inputs.land-environment }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::shipmill land: the environment $ENVIRONMENT has no SHIPMILL_LAND_KEY secret; add the App's private key to it as SHIPMILL_LAND_KEY, or drop land-environment from the land job in .github/workflows/release.yml. Nothing was pushed"
            exit 1
          fi
          while IFS= read -r line; do
            if [ -n "$line" ]; then echo "::add-mask::$line"; fi
          done <<<"$KEY"
          key="$RUNNER_TEMP/shipmill-land-key.pem"
          (umask 077; printf '%s\n' "$KEY" > "$key")
          chmod 600 "$key"
          echo "path=$key" >> "$GITHUB_OUTPUT"

      - name: Land, tag, and publish
        shell: bash # -eo pipefail: a failed land fails the step, though its output goes through tee
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL: ${{ inputs.tool }}
          LANE: ${{ inputs.lane }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.sha }}
          BASE: ${{ inputs.base }}
          APP_KEY: ${{ steps.key.outputs.path }}
        run: |
          args=(land --lane "$LANE" --version "$VERSION" --sha "$SHA" --base "$BASE")
          if [ -n "$APP_KEY" ]; then args+=(--app-key "$APP_KEY"); fi
          uvx --from "$TOOL" shipmill "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

  # Closes the lane's "Ready to release" issue, with the tag and this run. It sets no
  # permissions, so it runs with the caller's grant: under release = "propose", or on a stable
  # lane whose [bump] has `major` headings, closing needs `issues: write` on the caller's land
  # job; without it this job fails, after the release landed. Otherwise it reads nothing from
  # GitHub
  close-proposal:
    needs: land
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.7"

      - name: Close the lane's proposal issue
        shell: bash # -eo pipefail: a failed close fails the step, though its output goes through tee
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL: ${{ inputs.tool }}
          LANE: ${{ inputs.lane }}
          VERSION: ${{ inputs.version }}
        run: |
          uvx --from "$TOOL" shipmill close-proposal --lane "$LANE" --version "$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"

  cleanup:
    needs: land
    if: always()
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.7"

      - name: Delete the work branch
        env:
          TOOL: ${{ inputs.tool }}
          VERSION: ${{ inputs.version }}
        run: uvx --from "$TOOL" shipmill cleanup --version "$VERSION"

  # Spec 014: after a release landed, one shipmill-upgrade issue per config upgrade this repo
  # hasn't decided ([autonomy] upgrade; none under observe), and the issue of each upgrade the
  # config now sets closed, as is the open issue of an upgrade shipmill no longer offers
  # (`withdrawn`, S-031-21). It sets no permissions, so it runs with the caller's land grant,
  # whose `issues: write` also closes the proposal issue; no job needs it, so a failure here
  # fails this job only, naming the upgrade, after the release landed
  upgrade:
    needs: land
    concurrency:
      group: shipmill-upgrade
      cancel-in-progress: false
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.7"

      - name: Propose the pending config upgrades
        shell: bash # -eo pipefail: a failed propose fails the step, though its output goes through tee
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL: ${{ inputs.tool }}
        run: |
          uvx --from "$TOOL" shipmill upgrade --propose | tee -a "$GITHUB_STEP_SUMMARY"
