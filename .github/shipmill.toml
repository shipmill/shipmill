# shipmill releases itself with its own workflows, at the commit being released
requires = ">=0.78.0"  # after_publish (D-50); an older shipmill refuses the key
name = "shipmill"
mode = "release"
branch = "main"
version_files = "pyproject"
after_stamp = ["uv lock --check"]

[changelog]
style = "keep-a-changelog"
fragments = "changelog.d"

[bump]
from = "headings"
major = ["Breaking"]
minor = ["Added", "Changed", "Deprecated", "Removed"]
patch = ["Fixed", "Security"]

[gates]
blocker_label = "release-blocker"
blocker_lanes = ["stable"]

# A stable release after every batch of merges, and hotfixes by hand. Each publishes before it
# moves its references (D-50): move-major-tag.yml points @v0 and the marketplace ref at the
# release only once publish.yml's run passed and PyPI serves the version
[lanes.stable]
quiet_minutes = 30
github_release = true
dispatch = ["publish.yml"]  # PyPI (spec 010)
after_publish = ["move-major-tag.yml"]

[lanes.hotfix]
github_release = true
dispatch = ["publish.yml"]
after_publish = ["move-major-tag.yml"]  # moves nothing for a hotfix on an older series

# The plugin's version follows the package's, so a plugin update ships with each release
[[version_lines]]
file = ".claude-plugin/plugin.json"
pattern = '"version": "[^"]+"'
replace = '"version": "{version}"'

# The marketplace serves the release's tag, never main's unreleased commits (spec 031); its ref
# moves after publish, in move-major-tag.yml, not in the release commit (D-50)

# The skills run the CLI the plugin pins, `uvx shipmill==<plugin.json's version>` (spec 031):
# one entry per place the prose writes it out, each matching exactly once
[[version_lines]]
file = "skills/github-issue-triage/SKILL.md"
pattern = 'uvx shipmill==\d+\.\d+\.\d+(?= gh )'
replace = 'uvx shipmill=={version}'

[[version_lines]]
file = "skills/github-issue-triage/SKILL.md"
pattern = 'uvx shipmill==\d+\.\d+\.\d+(?= autonomy )'
replace = 'uvx shipmill=={version}'

[[version_lines]]
file = "skills/github-issue-triage/references/triage-rubric.md"
pattern = 'uvx shipmill==\d+\.\d+\.\d+'
replace = 'uvx shipmill=={version}'

[[version_lines]]
file = "skills/github-issue-resolve/SKILL.md"
pattern = 'uvx shipmill==\d+\.\d+\.\d+(?= gh )'
replace = 'uvx shipmill=={version}'

[[version_lines]]
file = "skills/github-issue-resolve/SKILL.md"
pattern = 'uvx shipmill==\d+\.\d+\.\d+(?= autonomy )'
replace = 'uvx shipmill=={version}'

[[version_lines]]
file = "skills/github-pr-triage/SKILL.md"
pattern = 'uvx shipmill==\d+\.\d+\.\d+(?= gh )'
replace = 'uvx shipmill=={version}'

[[version_lines]]
file = "skills/github-pr-triage/SKILL.md"
pattern = 'uvx shipmill==\d+\.\d+\.\d+(?= autonomy )'
replace = 'uvx shipmill=={version}'

[[version_lines]]
