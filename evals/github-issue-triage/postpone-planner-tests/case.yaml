schema_version: "1.1"
name: postpone-planner-tests
context:
  scaffold_script: ../../scaffold.sh
graders:
  # The shared no-miss grader, copied from evals/graders/no-miss.yaml
  - type: regex
    name: no-miss
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"kind": "miss"'
    match: not_contains
  # #836 asks to change how the release planner takes its inputs and to move about 286
  # tests onto it: a design that needs its own spec, which an agent's filing doesn't make
  # due, and CI time blocks nothing. The pass postponed it
  - type: regex
    name: verdict-postponed
    target: {source: file, path: .eval/gh.jsonl}
    pattern: 'Triage: \*\*postponed'
  - type: regex
    name: labels-it-postponed
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"--add-label", "([^"]*,)?postponed[,"]|"labels\[\]=postponed"'
  # never built or specified in this pass
  - type: regex
    name: no-other-verdict
    target: {source: file, path: .eval/gh.jsonl}
    pattern: 'Triage: \*\*(implement|feature)'
    match: not_contains
  - type: regex
    name: opens-no-pr
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"args": \["pr", "create"'
    match: not_contains
  # Every write goes through `shipmill gh` as the App (D-14): no plain gh write
  - type: regex
    name: writes-as-the-app
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"kind": "write", "args"'
    match: not_contains
  # No skill-loaded grader (#933): the prompt opens with /shipmill:github-issue-triage, which puts the
  # skill's text in the prompt, so the session never calls the Skill tool for it
