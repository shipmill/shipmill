schema_version: "1.1"
name: implement-token-race
context:
  scaffold_script: ../../scaffold.sh
graders:
  # The shared no-miss grader, copied from evals/graders/no-miss.yaml
  - type: regex
    name: no-miss
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"kind": "miss"'
    match: not_contains
  # #882 is a race the code shows at 6a4b49ea: `refreshed` in src/shipmill/app_login.py
  # deletes the stored token file on any refused refresh, the one another process just saved.
  # A confirmed bug is implement, as the pass triaged it
  - type: regex
    name: verdict-implement
    target: {source: file, path: .eval/gh.jsonl}
    pattern: 'Triage: \*\*implement\*\*'
  - type: regex
    name: no-other-verdict
    target: {source: file, path: .eval/gh.jsonl}
    pattern: 'Triage: \*\*(feature|opportunity|postponed|won.t fix|needs a decision)'
    match: not_contains
  # Verdicts only: no branch, no pull request
  - type: regex
    name: opens-no-pr
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"args": \["pr", "create"'
    match: not_contains
  # Every write goes through `shipmill gh` as the App (D-14): no plain gh write
  - type: regex
    name: writes-as-the-app
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"kind": "write", "args"'
    match: not_contains
  # No skill-loaded grader (#933): the prompt opens with /shipmill:github-issue-triage, which puts the
  # skill's text in the prompt, so the session never calls the Skill tool for it
