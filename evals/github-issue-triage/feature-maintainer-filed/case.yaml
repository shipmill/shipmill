schema_version: "1.1"
name: feature-maintainer-filed
context:
  scaffold_script: ../../scaffold.sh
graders:
  # The shared no-miss grader, copied from evals/graders/no-miss.yaml
  - type: regex
    name: no-miss
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"kind": "miss"'
    match: not_contains
  # #774 asks for new behaviour across the gate, status, and factory (a launch preflight,
  # a failing tick's cause, STALLED, what QUIET waits on), and the maintainer filed it:
  # a feature, as the pass triaged it. The case reads triage at `propose`, so the verdict
  # is a proposal through the needs-decision protocol, with no spec pull request yet
  - type: regex
    name: proposes-feature
    target: {source: file, path: .eval/gh.jsonl}
    pattern: 'Proposed verdict: \*\*feature\*\*'
  - type: regex
    name: asks-the-maintainer
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"body": "<!-- shipmill:needs-decision -->'
  - type: regex
    name: labels-it-needs-decision
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"--add-label", "([^"]*,)?needs-decision[,"]|"labels\[\]=needs-decision"'
  # not an opportunity: the maintainer's own filing is already their decision
  - type: regex
    name: never-an-opportunity
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '\*\*opportunity\*\*'
    match: not_contains
  # under propose, no verdict is applied and no spec pull request is opened
  - type: regex
    name: applies-no-verdict
    target: {source: file, path: .eval/gh.jsonl}
    pattern: 'Triage: \*\*'
    match: not_contains
  - type: regex
    name: opens-no-pr
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"args": \["pr", "create"'
    match: not_contains
  # Every write goes through `shipmill gh` as the App (D-14): no plain gh write
  - type: regex
    name: writes-as-the-app
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"kind": "write", "args"'
    match: not_contains
  # No skill-loaded grader (#933): the prompt opens with /shipmill:github-issue-triage, which puts the
  # skill's text in the prompt, so the session never calls the Skill tool for it
