schema_version: "1.1"
name: finding-token-refresh-race
context:
  scaffold_script: ../../scaffold.sh
graders:
  # The shared no-miss grader, copied from evals/graders/no-miss.yaml
  - type: regex
    name: no-miss
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"kind": "miss"'
    match: not_contains
  # A review only: no comment, review, label, push through gh, or merge
  - type: regex
    name: writes-nothing
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"kind": "(write|refused)"'
    match: not_contains
  - type: tool_used
    name: skill-loaded
    tool: Skill
    min: 1
  # #882, found in the review of #879 and fixed in #883: refresh tokens are single-use, so
  # when two processes refresh one stored token at once, the loser's refused refresh makes
  # `refreshed` delete the token file the winner just saved
  - type: llm
    name: raises-the-refresh-race
    criteria: |
      PASS only if the session's final report raises, as a finding, that in
      src/shipmill/app_login.py a refused or failed refresh of the decider's stored token
      deletes the stored token file without checking whether another process already
      replaced it, so two `shipmill gh` processes refreshing the same expired token at once
      can lose the token the other just saved (refresh tokens are single-use). Naming the
      race between concurrent refreshes and the deletion of the newly saved token is enough;
      the exact function name or line need not match. FAIL otherwise.
