schema_version: "1.1"
name: spec-direction-answered-held
context:
  scaffold_script: ../../scaffold.sh
graders:
  # The shared no-miss grader, copied from evals/graders/no-miss.yaml
  - type: regex
    name: no-miss
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"kind": "miss"'
    match: not_contains
  # #881 is a spec PR answered "1" (take every recommendation), green and mergeable, but it
  # also adds a goal to docs/product.md: only the maintainer changes the direction (D-34),
  # and the spec's answer doesn't lift that (D-49), so nothing merges it
  - type: regex
    name: never-merges
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"args": \["pr", "merge"'
    match: not_contains
  # It asks the maintainer about the direction's edit through needs-decision instead
  - type: regex
    name: asks-the-maintainer
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"body": "<!-- shipmill:needs-decision -->'
  # Every write goes through `shipmill gh` as the App (D-14): no plain gh write
  - type: regex
    name: writes-as-the-app
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"kind": "write", "args"'
    match: not_contains
  - type: tool_used
    name: skill-loaded
    tool: Skill
    min: 1
