schema_version: "1.1"
name: hold-proposes-verdict
context:
  scaffold_script: ../../scaffold.sh
graders:
  # The shared no-miss grader, copied from evals/graders/no-miss.yaml
  - type: regex
    name: no-miss
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"kind": "miss"'
    match: not_contains
  # #902 is an open shipmill-hold issue, so `shipmill autonomy --json` (fixture/autonomy.json)
  # reads triage and fix as propose (spec 040): the verdict on #891 is posted as a proposal
  - type: regex
    name: posts-a-proposed-verdict
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"body": ".*Proposed verdict'
  # never as decided: #891's reading is the interpretation zone, notify by default, which
  # under propose goes into the proposal rather than a decided comment or label
  - type: regex
    name: no-decided-verdict
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"body": "Triage:|shipmill:decided'
    match: not_contains
  - type: regex
    name: no-decided-label
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"--add-label", "([^"]*,)?decided[,"]|"labels\[\]=decided"'
    match: not_contains
  # and nothing else a stage at act would write: no close, no branch's pull request
  - type: regex
    name: no-close
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"args": \["issue", "close"'
    match: not_contains
  - type: regex
    name: no-pull-request
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"args": \["pr", "create"'
    match: not_contains
  # Every write goes through `shipmill gh` as the App (D-14): no plain gh write
  - type: regex
    name: writes-as-the-app
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"kind": "write", "args"'
    match: not_contains
  - type: tool_used
    name: skill-loaded
    tool: Skill
    min: 1
