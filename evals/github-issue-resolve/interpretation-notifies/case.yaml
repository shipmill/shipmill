schema_version: "1.1"
name: interpretation-notifies
context:
  scaffold_script: ../../scaffold.sh
graders:
  # The shared no-miss grader, copied from evals/graders/no-miss.yaml
  - type: regex
    name: no-miss
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"kind": "miss"'
    match: not_contains
  # #891 offers two readings of an approved spec that both meet it: the `interpretation`
  # zone, at `notify` by default (spec 030), so the session posts a decided comment with
  # its marker as the first line
  - type: regex
    name: posts-a-decided-comment
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"body": "<!-- shipmill:decided zone=[a-z-]+ until=\S+ -->'
  # and the decided label, the record the veto and the retro read
  - type: regex
    name: labels-it-decided
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"--add-label", "([^"]*,)?decided[,"]|"labels\[\]=decided"'
  # and goes on: no question, no needs-decision label
  - type: regex
    name: asks-nobody
    target: {source: file, path: .eval/gh.jsonl}
    pattern: 'shipmill:needs-decision'
    match: not_contains
  - type: regex
    name: no-needs-decision-label
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"--add-label", "[^"]*needs-decision'
    match: not_contains
  # Every write goes through `shipmill gh` as the App (D-14): no plain gh write
  - type: regex
    name: writes-as-the-app
    target: {source: file, path: .eval/gh.jsonl}
    pattern: '"kind": "write", "args"'
    match: not_contains
  - type: tool_used
    name: skill-loaded
    tool: Skill
    min: 1
